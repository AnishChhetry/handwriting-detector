{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        
        {% if message %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <h2 class="mb-3">Draw: <span class="badge bg-warning text-dark" style="font-size: 1.5em;">{{ letter }}</span></h2>
        
        <div class="d-flex justify-content-center">
            <canvas id="paintCanvas" width="200" height="200" class="canvas-container"></canvas>
        </div>

        <div class="mt-3">
            <button onclick="clearCanvas()" class="btn btn-secondary me-2">Clear</button>
            <button onclick="submitData()" class="btn btn-success">Save & Next</button>
        </div>

        <form id="dataForm" action="/add-data" method="POST" style="display:none;">
            <input type="hidden" name="letter" value="{{ letter }}">
            <input type="hidden" name="pixels" id="pixelsInput">
        </form>
    </div>
</div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // Config for drawing
    ctx.lineWidth = 15;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'white'; // Draw white on black

    // Mouse Events
    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);

    // Touch Events (for mobile)
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); });
    canvas.addEventListener('touchend', () => { isDrawing = false; ctx.beginPath(); });
    canvas.addEventListener('touchmove', drawTouch);

    function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function drawTouch(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function submitData() {
        // 1. Create a temporary smaller canvas to resize to 50x50
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 50;
        tempCanvas.height = 50;
        const tempCtx = tempCanvas.getContext('2d');
        
        // 2. Draw the main canvas onto the small canvas
        tempCtx.drawImage(canvas, 0, 0, 50, 50);
        
        // 3. Extract pixels
        const imgData = tempCtx.getImageData(0, 0, 50, 50);
        const data = imgData.data;
        let pixels = [];
        
        // 4. Convert RGBA to Grayscale (just take Red channel since it's B&W)
        for (let i = 0; i < data.length; i += 4) {
            pixels.push(data[i]); 
        }

        // 5. Submit
        document.getElementById('pixelsInput').value = pixels.join(',');
        document.getElementById('dataForm').submit();
    }
</script>
{% endblock %}
