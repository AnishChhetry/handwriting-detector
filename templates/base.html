<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .canvas-container { border: 4px solid #333; border-radius: 10px; background-color: black; cursor: crosshair; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">✍🏻 Handwriting Detector</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="/add-data">1. Add Data</a></li>
        
        <li class="nav-item mx-2">
            <a id="trainBtn" class="btn btn-warning fw-bold" href="/train" onclick="startTraining()">
                ⚡ Train Model
            </a>
        </li>

        <li class="nav-item"><a class="nav-link" href="/practice">2. Practice</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
function startTraining() {
    const btn = document.getElementById('trainBtn');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Training...';
    btn.classList.add('disabled');
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
